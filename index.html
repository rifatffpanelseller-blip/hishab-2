<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c6e">
<title>আমার হিসাব</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f7;--sf:#fff;--ink:#14282e;--mu:#5d7279;--ln:#dbe4e7;--br:#0f5c6e;--ob:#fff;--gt:#0b7a4b;--rd:#b3261e;--gb:#e3f4ec;--rb:#fbe9e7;--ac:#d6ebf0;color-scheme:light}
:root.dk{--bg:#0e1a1e;--sf:#16262c;--ink:#e6f0f2;--mu:#8fa5ac;--ln:#2a3e45;--br:#4fb3c8;--ob:#06222a;--gt:#4cc795;--rd:#ff8a80;--gb:#12342a;--rb:#3b1f1d;--ac:#1d3a43;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;font-size:17px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 0 120px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.hd,.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px 8px}
.top{justify-content:flex-start}
h1{margin:0;font-size:1.6rem;font-weight:700}
.av,.bk{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;flex:none}
.av{background:var(--br);color:var(--ob);font-weight:700}
.bk{background:var(--sf);border:1px solid var(--ln)}
.sum{display:flex;gap:10px;padding:8px 20px}
.bx{flex:1;border-radius:16px;padding:12px 14px}.bx small{display:block;font-size:.85rem;color:var(--mu)}.bx b{font-size:1.4rem}
.g{background:var(--gb)}.g b,.pos{color:var(--gt)}.r{background:var(--rb)}.r b,.neg{color:var(--rd)}
.sr{margin:6px 20px 10px;display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:0 14px;color:var(--mu)}
.sr input{flex:1;border:0;background:none;height:48px;outline:0;color:var(--ink)}
.ls{padding:0 20px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.ic{width:42px;height:42px;border-radius:50%;background:var(--ac);color:var(--br);display:grid;place-items:center;font-weight:700;flex:none}
.gr{flex:1;min-width:0}.gr b{display:block;overflow-wrap:anywhere}.gr span{font-size:.85rem;color:var(--mu)}
.am{text-align:right;font-weight:700;white-space:nowrap}.am small{display:block;font-weight:400;font-size:.78rem;color:var(--mu)}
.bd{font-size:.8rem;background:var(--ac);color:var(--br);border-radius:999px;padding:3px 10px;white-space:nowrap}
.empty{text-align:center;color:var(--mu);padding:30px 16px}
.sec{margin:16px 20px 6px;font-weight:600;color:var(--mu)}
.pan{margin:0 20px 12px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:2px 14px}
.set,.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.set:last-child,.tx:last-child{border:0}
.set a{color:var(--br);text-decoration:none;font-weight:600}
.mini{border:1px solid var(--ln);background:none;border-radius:10px;padding:6px 12px;color:var(--br);font-size:.9rem;text-decoration:none;font-weight:600}
.fl{margin:0 20px 12px}.fl label{display:block;font-size:.88rem;color:var(--mu);margin-bottom:4px}
.fl input,textarea{width:100%;height:48px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);padding:0 14px}
textarea{height:90px;padding:10px;margin-bottom:8px}
.seg{display:flex;gap:8px}.seg button{flex:1;height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--sf)}
.seg .on{background:var(--br);color:var(--ob);border-color:var(--br);font-weight:600}
.sv{display:block;margin:8px 20px;height:52px;width:calc(100% - 40px);border:0;border-radius:14px;background:var(--br);color:var(--ob);font-weight:600}
.sv.o{background:none;border:1px solid var(--ln);color:var(--br)}.sv.d{background:none;border:1px solid var(--ln);color:var(--rd)}
.bal{margin:8px 20px;border-radius:18px;padding:14px 18px}.bal small{display:block;color:var(--mu)}.bal b{font-size:2rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 20px 10px}.two input,.two select{margin:0}
select{height:48px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);padding:0 10px;width:100%}
.big{width:88px;height:88px;border-radius:50%;background:var(--br);color:var(--ob);font-size:2.2rem;font-weight:700;display:grid;place-items:center;margin:8px auto 14px}
.tg{width:48px;height:28px;border-radius:14px;border:0;background:var(--ln);position:relative;flex:none}
.tg i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--br)}.tg.on i{left:23px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav[hidden]{display:none}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:.75rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px}
nav .on{color:var(--br);font-weight:600}
.lk{max-width:340px;margin:25vh auto 0;padding:0 20px;text-align:center}.lk input{text-align:center;font-size:1.5rem;letter-spacing:.4em}
.er{color:var(--rd);min-height:1.5em}
</style>
</head>
<body>
<main id="m"></main>
<nav id="nv"></nav>
<script>
const K="hishab_v2";
let db={me:{name:"",phone:"",pin:"",dark:null},people:[]},v="home",cid=null,from="home",q="",ok=false,app_="whatsapp",edit=null,show=false;
try{const s=JSON.parse(localStorage.getItem(K));if(s&&Array.isArray(s.people))db=s;db.me=Object.assign({name:"",phone:"",pin:"",dark:null},db.me)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const $=i=>document.getElementById(i),bn=n=>Number(n).toLocaleString("bn-BD");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const bal=p=>p.tx.reduce((s,t)=>s+(t.type==="give"?t.amt:-t.amt),0);
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>{try{return new Date(d).toLocaleDateString("bn-BD",{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}};
const hp=s=>{let h=5381;for(const c of s)h=((h*33)^c.charCodeAt(0))>>>0;return String(h)};
const ini=(n,d="?")=>(n||"").trim()[0]||d;
const cur=()=>db.people.find(p=>p.id===cid);
const P={home:"M4 11l8-7 8 7v9h-5v-6H9v6H4z",add:"M12 5v14M5 12h14",eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z",me:"M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6",search:"M11 5a6 6 0 1 0 0 12 6 6 0 0 0 0-12zM20 20l-4-4",back:"M15 5l-7 7 7 7",call:"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z",key:"M14 10a4 4 0 1 0-3.5 4H12l2 2h2v2h2v-3l-4.6-4.6M7 10h.01",in:"M17 7L7 17M7 17h8M7 17V9",out:"M7 17L17 7M17 7H9M17 7v8"};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const isDark=()=>document.documentElement.classList.contains("dk");

function go(x,i){if(x==="person"){from=v==="saved"?"saved":"home";cid=i;show=false}else if(x==="add"){edit=null;app_="whatsapp"}v=x;q="";render();scrollTo(0,0)}
function render(){
 document.documentElement.classList.toggle("dk",db.me.dark??matchMedia("(prefers-color-scheme:dark)").matches);
 if(db.me.pin&&!ok)return lock();
 $("m").innerHTML=({home,add,saved,acct,person})[v]();
 const t=v==="person"?from:v;
 $("nv").hidden=false;
 $("nv").innerHTML=[["home","হোম","home"],["add","নাম্বার যোগ","add"],["saved","সেভ করা","eye"],["acct","মাই অ্যাকাউন্ট","me"]].map(a=>`<button class="${t===a[0]?"on":""}" onclick="go('${a[0]}')">${ic(a[2])}<span>${a[1]}</span></button>`).join("");
}
const filt=()=>db.people.filter(p=>(p.name+p.phone).toLowerCase().includes(q.toLowerCase()));
const srch=()=>`<div class="sr">${ic("search",20)}<input placeholder="নাম বা নাম্বার খুঁজুন" value="${esc(q)}" oninput="q=this.value;$('ls').innerHTML=list(filt())" aria-label="খুঁজুন"></div>`;
function list(l){
 if(!l.length)return `<div class="empty">${db.people.length?"কাউকে পাওয়া যায়নি":"এখনো কেউ নেই। নিচের “নাম্বার যোগ” থেকে প্রথম নাম্বার সেভ করুন।"}</div>`;
 return l.map(p=>{const b=bal(p);return `<button class="row" onclick="go('person','${p.id}')"><div class="ic">${esc(ini(p.name))}</div><div class="gr"><b>${esc(p.name)}</b><span>${esc(p.phone)}</span></div>${v==="home"?`<div class="am ${b>0?"pos":b<0?"neg":""}">${b?"৳"+bn(Math.abs(b)):"মিটে গেছে"}<small>${b>0?"পাবো":b<0?"দেবো":""}</small></div>`:`<span class="bd">${p.app==="imo"?"ইমো":"হোয়াটসঅ্যাপ"}</span>`}</button>`}).join("");
}
function home(){
 let g=0,r=0;db.people.forEach(p=>{const b=bal(p);b>0?g+=b:r-=b});
 return `<div class="hd"><h1>${db.me.name?"হ্যালো, "+esc(db.me.name):"আমার হিসাব"}</h1><button class="av" onclick="go('acct')" aria-label="মাই অ্যাকাউন্ট">${esc(ini(db.me.name,"আ"))}</button></div>
 <div class="sum"><div class="bx g"><small>মোট পাবো</small><b>৳${bn(g)}</b></div><div class="bx r"><small>মোট দেবো</small><b>৳${bn(r)}</b></div></div>${srch()}<div class="ls" id="ls">${list(filt())}</div>`;
}
function saved(){return `<div class="hd"><h1>সেভ করা নাম্বার</h1><span class="bd">${bn(db.people.length)} জন</span></div>${srch()}<div class="ls" id="ls">${list(filt())}</div>`}
function setApp(a){app_=a;document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.a===a))}
function add(){
 const p=db.people.find(x=>x.id===edit)||{};
 return `<div class="hd"><h1>${edit?"সম্পাদনা":"নাম্বার যোগ"}</h1></div>
 <div class="fl"><label for="n">নাম</label><input id="n" value="${esc(p.name)}" autocomplete="off"></div>
 <div class="fl"><label for="ph">মোবাইল নাম্বার</label><input id="ph" type="tel" inputmode="tel" value="${esc(p.phone)}"></div>
 <div class="fl"><label>কোন অ্যাপে সেভ হবে</label><div class="seg"><button type="button" data-a="whatsapp" class="${app_==="whatsapp"?"on":""}" onclick="setApp('whatsapp')">হোয়াটসঅ্যাপ</button><button type="button" data-a="imo" class="${app_==="imo"?"on":""}" onclick="setApp('imo')">ইমো</button></div></div>
 <div class="fl"><label for="pw">পাসওয়ার্ড</label><input id="pw" value="${esc(p.pw)}" autocomplete="off"></div>
 <div class="fl"><label for="nt">নোট (ঐচ্ছিক)</label><input id="nt" value="${esc(p.note)}"></div>
 <button class="sv" onclick="saveP()">সেভ করুন</button>`;
}
function saveP(){
 const name=$("n").value.trim();if(!name){$("n").focus();return}
 const d={name,phone:$("ph").value.trim(),app:app_,pw:$("pw").value,note:$("nt").value.trim()};
 let p=db.people.find(x=>x.id===edit);
 if(p)Object.assign(p,d);else{p=Object.assign({id:uid(),tx:[]},d);db.people.unshift(p)}
 save();cid=p.id;from="saved";v="person";show=false;render();scrollTo(0,0);
}
function editP(){const p=cur();edit=p.id;app_=p.app||"whatsapp";v="add";render()}
function delP(){const p=cur();if(confirm(p.name+" এবং তার সব হিসাব মুছে যাবে। নিশ্চিত?")){db.people=db.people.filter(x=>x.id!==p.id);save();go(from)}}
function cp(b){navigator.clipboard&&navigator.clipboard.writeText(cur().pw).then(()=>{b.textContent="কপি হয়েছে"})}
function person(){
 const p=cur();if(!p){v="home";return home()}
 const b=bal(p),d=p.phone.replace(/\D/g,"").replace(/^0/,"88");
 return `<div class="top"><button class="bk" onclick="go('${from}')" aria-label="ফিরে যান">${ic("back")}</button><h1>${esc(p.name)}</h1></div>
 <div class="pan"><div class="set">${ic("call",20)}<div class="gr"><span>নাম্বার • ${p.app==="imo"?"ইমো":"হোয়াটসঅ্যাপ"}</span><b><a href="tel:${esc(p.phone)}">${esc(p.phone)||"নেই"}</a></b></div>${p.app!=="imo"&&d?`<a class="mini" href="https://wa.me/${d}" target="_blank" rel="noopener">খুলুন</a>`:""}</div>
 <div class="set">${ic("key",20)}<div class="gr"><span>পাসওয়ার্ড</span><b>${p.pw?(show?esc(p.pw):"••••••"):"দেওয়া নেই"}</b></div>${p.pw?`<button class="mini" onclick="show=!show;render()">${show?"লুকান":"দেখুন"}</button><button class="mini" onclick="cp(this)">কপি</button>`:""}</div>
 ${p.note?`<div class="set"><div class="gr"><span>নোট</span><b>${esc(p.note)}</b></div></div>`:""}</div>
 <div class="bal ${b>0?"g":b<0?"r":""}" ${b?"":'style="background:var(--sf);border:1px solid var(--ln)"'}><small>${b>0?"আমি পাবো":b<0?"আমি দেবো":"হিসাব"}</small><b class="${b>0?"pos":b<0?"neg":""}">${b?"৳"+bn(Math.abs(b)):"মিটে গেছে"}</b></div>
 <div class="sec">নতুন লেনদেন</div>
 <div class="two"><select id="ty" aria-label="ধরন"><option value="get">পেয়েছি</option><option value="give">দিয়েছি</option></select><input id="am" type="number" inputmode="decimal" min="0" placeholder="টাকা" aria-label="টাকা" style="height:48px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);padding:0 14px"></div>
 <div class="two"><input id="dt" type="date" value="${today()}" aria-label="তারিখ" style="height:48px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);padding:0 10px"><input id="tn" placeholder="নোট" aria-label="নোট" style="height:48px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);padding:0 14px"></div>
 <button class="sv" onclick="addTx()">যোগ করুন</button>
 <div class="sec">লেনদেনের তালিকা</div>
 <div class="pan">${p.tx.length?p.tx.slice().sort((a,c)=>c.date.localeCompare(a.date)).map(t=>`<div class="tx"><div class="ic ${t.type==="get"?"pos":"neg"}">${ic(t.type==="get"?"in":"out",20)}</div><div class="gr"><b>${t.type==="get"?"পেয়েছি":"দিয়েছি"}</b><span>${fmt(t.date)}${t.note?" • "+esc(t.note):""}</span></div><div class="am ${t.type==="get"?"pos":"neg"}">৳${bn(t.amt)}</div><button class="mini" onclick="delTx('${t.id}')" aria-label="মুছুন">✕</button></div>`).join(""):`<div class="empty">এখনো কোনো লেনদেন নেই</div>`}</div>
 <button class="sv o" onclick="editP()">তথ্য সম্পাদনা করুন</button><button class="sv d" onclick="delP()">এই মানুষটিকে মুছুন</button>`;
}
function addTx(){const a=parseFloat($("am").value);if(!(a>0)){$("am").focus();return}
 cur().tx.push({id:uid(),type:$("ty").value,amt:a,date:$("dt").value||today(),note:$("tn").value.trim()});save();render()}
function delTx(i){if(confirm("এই লেনদেন মুছবেন?")){const p=cur();p.tx=p.tx.filter(t=>t.id!==i);save();render()}}
function acct(){
 return `<div class="hd"><h1>মাই অ্যাকাউন্ট</h1></div><div class="big">${esc(ini(db.me.name,"আ"))}</div>
 <div class="fl"><label for="mn">আপনার নাম</label><input id="mn" value="${esc(db.me.name)}" autocomplete="off"></div>
 <div class="fl"><label for="mp">মোবাইল নাম্বার</label><input id="mp" type="tel" inputmode="tel" value="${esc(db.me.phone)}"></div>
 <button class="sv" onclick="saveMe()">সেভ করুন</button>
 <div class="sec">সেটিংস</div>
 <div class="pan"><div class="set"><div class="gr"><b>ডার্ক থিম</b></div><button class="tg ${isDark()?"on":""}" role="switch" aria-checked="${isDark()}" aria-label="ডার্ক থিম" onclick="db.me.dark=!isDark();save();render()"><i></i></button></div>
 <div class="set"><div class="gr"><b>পিন লক</b><span>${db.me.pin?"চালু আছে":"বন্ধ আছে"}</span></div>${db.me.pin?`<button class="mini" onclick="offPin()">বন্ধ করুন</button>`:`<input id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="৪ সংখ্যা" aria-label="নতুন পিন" style="width:90px;height:40px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);padding:0 10px"><button class="mini" onclick="setPin()">চালু করুন</button>`}</div></div>
 <div class="sec">ব্যাকআপ</div>
 <div class="fl"><textarea id="ta" readonly aria-label="ব্যাকআপ">${esc(JSON.stringify(db))}</textarea><button class="mini" onclick="navigator.clipboard&&navigator.clipboard.writeText($('ta').value).then(()=>{this.textContent='কপি হয়েছে'})">ব্যাকআপ কপি করুন</button></div>
 <div class="fl"><textarea id="rs" placeholder="ব্যাকআপের লেখা এখানে পেস্ট করুন" aria-label="রিস্টোর"></textarea><button class="mini" onclick="restore()">রিস্টোর করুন</button></div>`;
}
function saveMe(){db.me.name=$("mn").value.trim();db.me.phone=$("mp").value.trim();save();render()}
function setPin(){const x=$("pn").value;if(!/^\d{4}$/.test(x)){alert("৪টি সংখ্যার পিন দিন");return}db.me.pin=hp(x);ok=true;save();render()}
function offPin(){db.me.pin="";save();render()}
function restore(){try{const d=JSON.parse($("rs").value);if(!Array.isArray(d.people))throw 0;if(confirm("বর্তমান সব তথ্য বদলে যাবে। নিশ্চিত?")){db=d;db.me=Object.assign({name:"",phone:"",pin:"",dark:null},db.me);save();ok=false;v="home";render()}}catch(e){alert("ব্যাকআপের লেখাটি ঠিক নেই")}}
function lock(){
 $("nv").hidden=true;
 $("m").innerHTML=`<div class="lk"><div class="big">${ic("key",36)}</div><h1>পিন দিন</h1><p class="er" id="er"></p><input id="lp" type="password" inputmode="numeric" maxlength="4" aria-label="পিন" style="width:100%;height:56px;border:1px solid var(--ln);border-radius:12px;background:var(--sf)" onkeydown="if(event.key==='Enter')unlock()"><button class="sv" style="width:100%;margin:12px 0" onclick="unlock()">খুলুন</button></div>`;
}
