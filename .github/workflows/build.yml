name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          mkdir www
          cp index.html manifest.json sw.js icon-192.png icon-512.png native.js www/
          sed -i 's#</body>#<script src="native.js"></script></body>#' www/index.html
          npm install
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.VIBRATE"/><queries><package android:name="com.whatsapp"/><package android:name="com.whatsapp.w4b"/><package android:name="com.imo.android.imoim"/></queries><application#' $M
          J=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(grep -m1 '^package ' $J)
          cat > $J <<EOF
          $PKG

          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onStart() {
              super.onStart();
              getBridge().getWebView().setWebViewClient(new BridgeWebViewClient(getBridge()) {
                @Override
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                  String url = req.getUrl().toString();
                  if (url.startsWith("intent:")) {
                    try {
                      startActivity(Intent.parseUri(url, Intent.URI_INTENT_SCHEME));
                    } catch (Exception e) {
                      try {
                        String fb = Intent.parseUri(url, Intent.URI_INTENT_SCHEME).getStringExtra("browser_fallback_url");
                        if (fb != null) startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(fb)));
                      } catch (Exception ignored) {}
                    }
                    return true;
                  }
                  return super.shouldOverrideUrlLoading(view, req);
                }
              });
            }
          }
          EOF
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hishab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
