name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          mkdir www
          cp index.html manifest.json sw.js icon-192.png icon-512.png native.js www/
          sed -i 's#</body>#<script src="native.js"></script></body>#' www/index.html
          sed -i 's|intent://send/${d}#Intent;scheme=smsto;package=${pk};action=android.intent.action.SENDTO;|intent://send?phone=${d}#Intent;scheme=whatsapp;package=${pk};|g' www/index.html
          npm install
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          ADD=$(cat manifest-add.txt)
          sed -i "s#<application#${ADD}<application#" $M
          J=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(grep -m1 '^package ' $J)
          { echo "$PKG"; echo; cat MainActivity.java.txt; } > $J
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hishab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
